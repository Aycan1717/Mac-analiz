name: Futbol Verisini Guncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository dosyalarini al
        uses: actions/checkout@v4

      - name: Bugunun maclarini cek
        env:
          API_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          mkdir -p data
          TODAY=$(TZ=Europe/Istanbul date +%F)

          curl --fail --silent --show-error \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY&timezone=Europe%2FIstanbul" \
            -o data/today.json

          python3 - <<'PY'
          import json

          with open("data/today.json", "r", encoding="utf-8") as f:
              d = json.load(f)

          if d.get("errors"):
              raise SystemExit(f"API hatasi: {d['errors']}")

          print("Mac sayisi:", d.get("results", 0))
          PY

      - name: Veriyi kaydet
        run: |
          git config user.name "Mac Analiz Bot"
          git config user.email "actions@github.com"
          git add data/today.json

          if git diff --cached --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "Bugunun futbol verisini guncelle"
            git push
          fi
