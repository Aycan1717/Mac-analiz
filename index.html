<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maç Analiz iPhone – v2</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f7;color:#111}
main{max-width:820px;margin:auto;padding:14px}
.card{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #0001}
h1{font-size:27px;margin:2px 0 6px}.muted{color:#666;font-size:13px;line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
label{font-size:13px;color:#555;display:block;margin-bottom:5px}
select,input{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;box-sizing:border-box;font-size:16px;background:#fff}
button{width:100%;padding:14px;border:0;border-radius:12px;font-size:17px;font-weight:700;background:#111;color:#fff;margin-top:8px}
button:disabled{opacity:.5}.stat{font-size:25px;font-weight:800}
.ok{color:#0a7a2d;font-weight:700}.err{color:#b00020;font-weight:700;white-space:pre-wrap}
.scroll{overflow:auto} table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}
</style>
</head>
<body><main>
<div class="card">
<h1>⚽ Maç Analiz</h1>
<div class="muted">2020–2026 geçmiş 1X2 oranlarını lig lig tarar. Veriler Football-Data kaynaklı CSV dosyalarından okunur.</div>
</div>

<div class="card">
<button id="load" onclick="loadAll()">Verileri Otomatik Yükle</button>
<div id="status" class="muted" style="margin-top:10px">Henüz veri yüklenmedi.</div>
<div id="error" class="err" style="margin-top:8px"></div>
</div>

<div class="card">
<div class="grid">
<div><label>Lig</label><select id="league"><option value="all">Tüm ligler</option></select></div>
<div><label>Bookmaker</label>
<select id="book"><option value="Bet365">Bet365</option><option value="Bwin">Bwin</option><option value="Max">Piyasa Max X</option></select></div>
<div><label>Min X</label><input id="min" type="number" step=".01" value="3.00"></div>
<div><label>Max X</label><input id="max" type="number" step=".01" value="3.40"></div>
</div>
<button id="analyze" onclick="analyze()" disabled>Analizi Başlat</button>
</div>
<div id="out"></div>

<script>
let rows=[];
const BASE='https://www.football-data.co.uk/mmz4281/';
const LEAGUES={
 'İngiltere':['E0','E1','E2','E3','EC'],
 'İskoçya':['SC0','SC1','SC2','SC3'],
 'Almanya':['D1','D2'],
 'İtalya':['I1','I2'],
 'İspanya':['SP1','SP2'],
 'Fransa':['F1','F2'],
 'Hollanda':['N1'],
 'Belçika':['B1'],
 'Portekiz':['P1'],
 'Türkiye':['T1'],
 'Yunanistan':['G1']
};

function splitCSV(s){
 const out=[]; let cur='', q=false;
 for(let i=0;i<s.length;i++){const ch=s[i];
  if(ch==='"'){ if(q && s[i+1]==='"'){cur+='"';i++;} else q=!q; }
  else if(ch===','&&!q){out.push(cur);cur='';} else cur+=ch;
 }
 out.push(cur); return out;
}
function parseCSV(text){
 const lines=text.replace(/\r/g,'').split('\n').filter(x=>x.trim());
 if(!lines.length)return [];
 const h=splitCSV(lines[0]).map(x=>x.trim());
 return lines.slice(1).map(line=>{const p=splitCSV(line),o={};h.forEach((k,i)=>o[k]=p[i]??'');return o;});
}
function n(v){let x=parseFloat(String(v??'').replace(',','.'));return Number.isFinite(x)?x:null}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

async function fetchText(url){
 const candidates=[
   url,
   'https://api.allorigins.win/raw?url='+encodeURIComponent(url),
   'https://corsproxy.io/?'+encodeURIComponent(url)
 ];
 let errors=[];
 for(const u of candidates){
   try{
     const r=await fetch(u,{cache:'no-store'});
     if(!r.ok) throw new Error('HTTP '+r.status);
     const t=await r.text();
     if(t && t.includes('HomeTeam') && t.length>100) return t;
     throw new Error('CSV içeriği alınamadı');
   }catch(e){errors.push(e.message);}
 }
 throw new Error(errors.join(' | '));
}

function normalize(o,country,code,season){
 const f=o.FTR||o.FTResult;
 if(!f)return null;
 return {
   date:o.Date||'',
   league:country+' • '+code,
   home:o.HomeTeam||'',
   away:o.AwayTeam||'',
   result:f==='D'?'D':f==='H'?'H':'A',
   b365:n(o.B365D),
   bwin:n(o.BWD),
   max:n(o.MaxD),
   season
 };
}

async function oneFile(season,country,code){
 const url=BASE+season+'/'+code+'.csv';
 const t=await fetchText(url);
 return parseCSV(t).map(o=>normalize(o,country,code,season)).filter(Boolean);
}

async function loadAll(){
 const b=document.getElementById('load'), st=document.getElementById('status'),
       er=document.getElementById('error'), an=document.getElementById('analyze');
 b.disabled=true; an.disabled=true; rows=[]; er.textContent='';
 b.textContent='Yükleniyor…';
 const jobs=[];
 for(let start=20; start<=25; start++){
   const season=String(start).padStart(2,'0')+String(start+1).padStart(2,'0');
   for(const [country,codes] of Object.entries(LEAGUES))
     for(const code of codes) jobs.push({season,country,code});
 }
 let done=0,fail=0;
 const queue=[...jobs];
 async function worker(){
   while(queue.length){
     const j=queue.shift();
     try{ rows.push(...await oneFile(j.season,j.country,j.code)); }
     catch(e){ fail++; }
     done++;
     st.textContent=`Yükleniyor: ${done}/${jobs.length} dosya • ${rows.length.toLocaleString('tr-TR')} maç`;
   }
 }
 await Promise.all(Array.from({length:4},worker));
 b.disabled=false; b.textContent='Verileri Yeniden Yükle';
 if(!rows.length){
   st.textContent='Veri yüklenemedi.';
   er.textContent='iPhone/Safari bu HTML dosyasından dış veri bağlantısını engelliyor. Bu durumda programı GitHub Pages üzerinden açmak gerekir.';
   return;
 }
 const ls=[...new Set(rows.map(r=>r.league))].sort((a,b)=>a.localeCompare(b,'tr'));
 document.getElementById('league').innerHTML='<option value="all">Tüm ligler</option>'+ls.map(x=>`<option>${esc(x)}</option>`).join('');
 st.innerHTML=`<span class="ok">✓ ${rows.length.toLocaleString('tr-TR')} maç yüklendi • ${ls.length} lig</span>`+(fail?` • ${fail} dosya alınamadı`:'');
 an.disabled=false;
}

function odd(r,b){return b==='Bet365'?r.b365:b==='Bwin'?r.bwin:r.max}
function analyze(){
 const lg=document.getElementById('league').value,b=document.getElementById('book').value,
 min=+document.getElementById('min').value,max=+document.getElementById('max').value;
 const f=rows.filter(r=>{const o=odd(r,b);return o!=null&&o>=min&&o<=max&&(lg==='all'||r.league===lg)});
 const d=f.filter(r=>r.result==='D').length,p=f.length?100*d/f.length:0;
 const by={}; f.forEach(r=>{by[r.league]??={n:0,d:0};by[r.league].n++;if(r.result==='D')by[r.league].d++});
 const leagues=Object.entries(by).map(([k,v])=>({k,...v,p:v.d/v.n*100})).sort((a,b)=>b.p-a.p);
 document.getElementById('out').innerHTML=`
 <div class="card"><div class="grid">
 <div><div class="muted">Uygun maç</div><div class="stat">${f.length}</div></div>
 <div><div class="muted">Beraberlik</div><div class="stat">${d}</div></div></div>
 <p><b>Geçmiş beraberlik oranı: %${p.toFixed(1)}</b></p></div>
 <div class="card"><b>Liglere göre</b><div class="scroll"><table>
 <tr><th>Lig</th><th>Maç</th><th>X</th><th>%</th></tr>
 ${leagues.map(x=>`<tr><td>${esc(x.k)}</td><td>${x.n}</td><td>${x.d}</td><td><b>%${x.p.toFixed(1)}</b></td></tr>`).join('')}
 </table></div></div>`;
}
</script>
</main></body></html>
